name: test

# Runs go vet + go test + go build on every push to main and every PR.
#
# Safety note: this workflow does not read any user-controlled event fields,
# so expression-injection patterns do not apply here. PRs from forks run
# without write access by default (GitHub policy for first-time contributors).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go build
        run: go build -o tflint-ruleset-module-defaults ./cmd
